name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc-config.json'

  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tutorial files exist
        run: |
          echo "Checking tutorial files..."
          for file in \
            "tutorials/构建你自己的操作系统.md" \
            "tutorials/构建你自己的数据库.md" \
            "tutorials/构建你自己的Web服务器.md" \
            "tutorials/构建你自己的编程语言.md" \
            "tutorials/构建你自己的区块链.md" \
            "tutorials/构建你自己的搜索引擎.md" \
            "tutorials/构建你自己的Git.md" \
            "tutorials/构建你自己的Docker.md" \
            "tutorials/构建你自己的神经网络.md" \
            "tutorials/构建你自己的游戏引擎.md"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing tutorial: $file"
              exit 1
            fi
            echo "  ✓ $file"
          done
          echo "All tutorial files present!"

      - name: Check community files exist
        run: |
          echo "Checking community files..."
          for file in \
            "README.md" \
            "LICENSE" \
            "CONTRIBUTING.md" \
            "SECURITY.md" \
            "CODE_OF_CONDUCT.md" \
            "CHANGELOG.md" \
            ".gitignore"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
            echo "  ✓ $file"
          done
          echo "All community files present!"

      - name: Check minimum tutorial length
        run: |
          MIN_LINES=200
          for file in tutorials/*.md; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt "$MIN_LINES" ]; then
              echo "ERROR: $file has only $lines lines (minimum: $MIN_LINES)"
              exit 1
            fi
            echo "  ✓ $file ($lines lines)"
          done
          echo "All tutorials meet minimum length requirement!"
